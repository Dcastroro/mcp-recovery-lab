[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-recovery-lab"
version = "0.1.0"
description = "A local MCP server with deterministic failure scenarios for testing agent recovery."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
mcp-recovery-lab = "mcp_recovery_lab.server:main"

[tool.setuptools.packages.find]
where = ["src"]
