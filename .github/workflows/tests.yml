name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Exercise the official MCP client
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install 'mcp>=2.3,<3'
          python examples/client.py
          python examples/verify_scenarios.py
      - name: Exercise a scripted Pydantic AI agent
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          PYDANTIC_AI_NO_BANNER: '1'
        run: |
          python -m pip install 'pydantic-ai-slim[mcp]>=2.66,<3'
          python examples/test_scripted_model.py
          python examples/pydantic_agent.py
